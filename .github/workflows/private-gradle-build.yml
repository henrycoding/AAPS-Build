name: Private Gradle Build

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Branch, tag, or commit to build from the private repository
        required: true
        default: master
      gradle_task:
        description: Optional Gradle task override. Empty uses :app:assemble{Flavor}Release.
        required: false
        default: ""
      project_dir:
        description: Directory inside the private repository that contains gradlew
        required: true
        default: .
      flavor:
        description: AAPS APK flavor
        required: true
        type: choice
        options:
          - full
          - mednovo
        default: full
      upload_to_odoo:
        description: Upload the built APK to Odoo as a draft AAPS update
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      changelog:
        description: Draft changelog sent to Odoo
        required: false
        default: ""
      force_update:
        description: Mark this draft as a forced update
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      show_failure_log_tail:
        description: Print the last build log lines on failure. This may expose private paths or source snippets.
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  group: private-gradle-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build private Gradle project
    # O-MVLL 1.9 Linux binaries require the Ubuntu 24 runtime libraries.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PRIVATE_REF: ${{ inputs.private_ref }}
      GRADLE_TASK_INPUT: ${{ inputs.gradle_task }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      FLAVOR: ${{ inputs.flavor }}
      CHANGELOG: ${{ inputs.changelog }}
      FORCE_UPDATE: ${{ inputs.force_update }}
      SHOW_FAILURE_LOG_TAIL: ${{ inputs.show_failure_log_tail }}

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          HOST: ${{ secrets.HOST }}
          AAPS_UPDATE_TOKEN: ${{ secrets.AAPS_UPDATE_TOKEN }}
          TANG_KEYSTORE_BASE64: ${{ secrets.TANG_KEYSTORE_BASE64 }}
          TANG_STORE_PASSWORD: ${{ secrets.TANG_STORE_PASSWORD }}
          TANG_KEY_ALIAS: ${{ secrets.TANG_KEY_ALIAS }}
          TANG_KEY_PASSWORD: ${{ secrets.TANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_REPOSITORY}" ]]; then
            echo "Missing repository secret: PRIVATE_REPOSITORY"
            exit 1
          fi

          if [[ -z "${PRIVATE_DEPLOY_KEY}" ]]; then
            echo "Missing repository secret: PRIVATE_DEPLOY_KEY"
            exit 1
          fi

          if [[ "${{ inputs.upload_to_odoo }}" == "true" && -z "${AAPS_UPDATE_TOKEN}" ]]; then
            echo "Odoo upload is enabled, but AAPS_UPDATE_TOKEN is missing."
            exit 1
          fi

          if [[ "${{ inputs.upload_to_odoo }}" == "true" && -z "${HOST}" ]]; then
            echo "Odoo upload is enabled, but HOST is missing."
            exit 1
          fi

          if [[ -z "${TANG_KEYSTORE_BASE64}" ]]; then
            echo "Missing repository secret: TANG_KEYSTORE_BASE64"
            exit 1
          fi

          if [[ -z "${TANG_STORE_PASSWORD}" ]]; then
            echo "Missing repository secret: TANG_STORE_PASSWORD"
            exit 1
          fi

          if [[ -z "${TANG_KEY_ALIAS}" ]]; then
            echo "Missing repository secret: TANG_KEY_ALIAS"
            exit 1
          fi

          if [[ -z "${TANG_KEY_PASSWORD}" ]]; then
            echo "Missing repository secret: TANG_KEY_PASSWORD"
            exit 1
          fi

      - name: Configure SSH for private checkout
        shell: bash
        env:
          PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          ssh-keyscan github.com 2>/dev/null >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          ssh-add - <<< "${PRIVATE_DEPLOY_KEY}"

          {
            echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}"
            echo "SSH_AGENT_PID=${SSH_AGENT_PID}"
          } >> "${GITHUB_ENV}"

      - name: Checkout private repository
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
        run: |
          set -euo pipefail

          git init --quiet private-source
          cd private-source
          git remote add origin "git@github.com:${PRIVATE_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin "${PRIVATE_REF}"
          git checkout --quiet --detach FETCH_HEAD

          ssh-add -D >/dev/null 2>&1 || true
          kill "${SSH_AGENT_PID}" >/dev/null 2>&1 || true

      - name: Restore Android signing config
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        env:
          TANG_KEYSTORE_BASE64: ${{ secrets.TANG_KEYSTORE_BASE64 }}
          TANG_STORE_PASSWORD: ${{ secrets.TANG_STORE_PASSWORD }}
          TANG_KEY_ALIAS: ${{ secrets.TANG_KEY_ALIAS }}
          TANG_KEY_PASSWORD: ${{ secrets.TANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf '%s' "${TANG_KEYSTORE_BASE64}" | base64 --decode > tang.keystore
          else
            printf '%s' "${TANG_KEYSTORE_BASE64}" | base64 -D > tang.keystore
          fi

          {
            echo ""
            echo "tangStorePassword=${TANG_STORE_PASSWORD}"
            echo "tangKeyAlias=${TANG_KEY_ALIAS}"
            echo "tangKeyPassword=${TANG_KEY_PASSWORD}"
          } >> local.properties

      - name: Restore O-MVLL Linux deps cache
        id: omvll-linux-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: private-source/**/third_party/o-mvll/deps/LLVM21-NDK29-Linux
          key: omvll-linux-deps-llvm21-ndk29-v7

      - name: Prepare O-MVLL Linux deps
        if: ${{ steps.omvll-linux-deps-cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          omvll_root="third_party/o-mvll"
          deps_dir="${omvll_root}/deps"
          target_dir="${deps_dir}/LLVM21-NDK29-Linux"
          tmp_dir="${RUNNER_TEMP}/omvll-linux-deps"
          build_deps_dir="${tmp_dir}/build-deps"
          omvll_commit="9e70384a5e3356164f8aea78b956b81aa1dae04f"

          rm -rf "${tmp_dir}"
          mkdir -p "${tmp_dir}" "${build_deps_dir}" "${deps_dir}"

          sudo apt-get update -qq
          sudo apt-get install --yes libc++-dev libc++abi-dev

          curl --fail --location --retry 3 --retry-delay 10 \
            --output "${tmp_dir}/omvll-deps-ndk-r29d.tar" \
            "https://open-obfuscator.build38.io/static/omvll-deps-ndk-r29d.tar"

          tar -xf "${tmp_dir}/omvll-deps-ndk-r29d.tar" -C "${tmp_dir}"
          bundle_dir="$(find "${tmp_dir}" -maxdepth 2 -type d -name 'omvll-deps-ndk-*' -print -quit)"
          if [[ -z "${bundle_dir}" ]]; then
            echo "O-MVLL dependency bundle directory was not found"
            exit 1
          fi

          tar -xzf "${bundle_dir}/android-llvm-toolchain-r29d.tar.gz" -C "${tmp_dir}"
          tar -xzf "${bundle_dir}/Python-slim.tar.gz" -C "${build_deps_dir}"
          tar -xzf "${bundle_dir}/pybind11.tar.gz" -C "${build_deps_dir}"
          tar -xzf "${bundle_dir}/spdlog-1.10.0-Linux.tar.gz" -C "${build_deps_dir}"

          toolchain_dir="$(find "${tmp_dir}" -type d -name android-llvm-toolchain-r29d -print -quit)"
          if [[ -z "${toolchain_dir}" ]]; then
            echo "O-MVLL deps did not contain android-llvm-toolchain-r29d"
            exit 1
          fi

          if [[ -f "${toolchain_dir}/out.tar.gz" && ! -d "${toolchain_dir}/out" ]]; then
            tar -xzf "${toolchain_dir}/out.tar.gz" -C "${toolchain_dir}"
          fi

          if [[ -f "${toolchain_dir}/out/stage1-install.tar.gz" && ! -d "${toolchain_dir}/out/stage1-install" ]]; then
            tar -xzf "${toolchain_dir}/out/stage1-install.tar.gz" -C "${toolchain_dir}/out"
          fi

          if [[ -f "${toolchain_dir}/out/stage2.tar.gz" && ! -d "${toolchain_dir}/out/stage2" ]]; then
            tar -xzf "${toolchain_dir}/out/stage2.tar.gz" -C "${toolchain_dir}/out"
          fi

          stage1_dir="${toolchain_dir}/out/stage1-install"
          stage2_dir="${toolchain_dir}/out/stage2"
          host_libcxx="$(find /usr/lib -name 'libc++.so.1' -print -quit)"
          required_build_paths=(
            "${stage1_dir}/bin/clang"
            "${stage1_dir}/bin/clang++"
            "${stage2_dir}/lib/cmake/llvm/LLVMConfig.cmake"
            "${host_libcxx}"
            "${build_deps_dir}/Python-slim/lib/libpython3.10.a"
            "${build_deps_dir}/Python-slim/include/python3.10"
            "${build_deps_dir}/pybind11/share/cmake/pybind11"
            "${build_deps_dir}/spdlog-1.10.0-Linux/lib/cmake/spdlog"
          )
          for required_path in "${required_build_paths[@]}"; do
            if [[ ! -e "${required_path}" ]]; then
              echo "Required O-MVLL build dependency is missing: ${required_path}"
              exit 1
            fi
          done

          curl --fail --location --retry 3 --retry-delay 10 \
            --output "${tmp_dir}/o-mvll-source.tar.gz" \
            "https://github.com/open-obfuscator/o-mvll/archive/${omvll_commit}.tar.gz"
          mkdir -p "${tmp_dir}/source"
          tar -xzf "${tmp_dir}/o-mvll-source.tar.gz" \
            -C "${tmp_dir}/source" --strip-components=1

          omvll_cmake="${tmp_dir}/source/src/CMakeLists.txt"
          if ! grep -qF 'spdlog::spdlog pybind11::headers' "${omvll_cmake}"; then
            echo "Unsupported O-MVLL spdlog link configuration"
            exit 1
          fi
          sed -i \
            's/spdlog::spdlog pybind11::headers/spdlog::spdlog_header_only pybind11::headers/' \
            "${omvll_cmake}"
          sed -i \
            '/^add_subdirectory("core")/i target_link_libraries(OMVLL PRIVATE "${OMVLL_LIBCXX_RUNTIME}")' \
            "${omvll_cmake}"

          command -v cmake >/dev/null
          command -v ninja >/dev/null
          cmake -S "${tmp_dir}/source/src" -B "${tmp_dir}/plugin-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${stage1_dir}/bin/clang++" \
            -DCMAKE_C_COMPILER="${stage1_dir}/bin/clang" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -std=c++17" \
            -DPython3_ROOT_DIR="${build_deps_dir}/Python-slim" \
            -DPython3_LIBRARY="${build_deps_dir}/Python-slim/lib/libpython3.10.a" \
            -DPython3_INCLUDE_DIR="${build_deps_dir}/Python-slim/include/python3.10" \
            -Dpybind11_DIR="${build_deps_dir}/pybind11/share/cmake/pybind11" \
            -Dspdlog_DIR="${build_deps_dir}/spdlog-1.10.0-Linux/lib/cmake/spdlog" \
            -DLLVM_DIR="${stage2_dir}/lib/cmake/llvm" \
            -DOMVLL_LIBCXX_RUNTIME="${host_libcxx}" \
            -DOMVLL_ABI=CustomAndroid
          cmake --build "${tmp_dir}/plugin-build" --target OMVLL --parallel 4

          if [[ ! -s "${tmp_dir}/plugin-build/libOMVLL.so" ]]; then
            echo "O-MVLL source build did not produce libOMVLL.so"
            exit 1
          fi

          rm -rf "${target_dir}"
          mkdir -p "${tmp_dir}/plugin-runtime"
          for runtime_name in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            runtime_path="$(find /usr/lib -name "${runtime_name}" -print -quit)"
            if [[ -n "${runtime_path}" ]]; then
              cp -L "${runtime_path}" "${tmp_dir}/plugin-runtime/${runtime_name}"
            fi
          done
          mv "${stage2_dir}" "${target_dir}"
          cp "${tmp_dir}/plugin-build/libOMVLL.so" "${target_dir}/omvll-ndk.so"
          cp "${tmp_dir}"/plugin-runtime/* "${target_dir}/lib/"

          for required_path in \
            "${target_dir}/lib/libLLVM.so" \
            "${target_dir}/omvll-ndk.so"; do
            if [[ ! -s "${required_path}" ]]; then
              echo "O-MVLL Linux deps did not produce ${required_path}"
              exit 1
            fi
          done

          rm -rf "${tmp_dir}"

      - name: Save O-MVLL Linux deps cache
        if: ${{ steps.omvll-linux-deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: private-source/**/third_party/o-mvll/deps/LLVM21-NDK29-Linux
          key: omvll-linux-deps-llvm21-ndk29-v7

      - name: Set up JDK 17 for nested tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Add Linux java_home compatibility shim
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /usr/libexec
          sudo tee /usr/libexec/java_home >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == "-v" && "${2:-}" == "17" && -n "${JAVA_HOME_17_X64:-}" ]]; then
            printf '%s\n' "${JAVA_HOME_17_X64}"
            exit 0
          fi

          if [[ -n "${JAVA_HOME:-}" ]]; then
            printf '%s\n' "${JAVA_HOME}"
            exit 0
          fi

          echo "No matching Java home found" >&2
          exit 1
          SH
          sudo chmod +x /usr/libexec/java_home

      - name: Make Gradle wrapper executable
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Select Android native toolchains
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          project_ndk_version="29.0.14206865"
          project_cmake_version="3.22.1"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${sdkmanager}" ]]; then
            echo "sdkmanager not found at ${sdkmanager}"
            exit 1
          fi

          install_sdk_package() {
            local package_name="$1"
            set +o pipefail
            if ! yes | "${sdkmanager}" "${package_name}" >/dev/null; then
              set -o pipefail
              echo "Failed to install Android SDK package ${package_name}"
              exit 1
            fi
            set -o pipefail
          }

          if [[ ! -x "${sdk_root}/ndk/${project_ndk_version}/ndk-build" ]]; then
            install_sdk_package "ndk;${project_ndk_version}"
          fi

          if [[ ! -x "${sdk_root}/cmake/${project_cmake_version}/bin/cmake" ]]; then
            install_sdk_package "cmake;${project_cmake_version}"
          fi

          ndk_dir="${sdk_root}/ndk/${project_ndk_version}"
          if [[ ! -x "${ndk_dir}/ndk-build" ]]; then
            echo "NDK ${project_ndk_version} was not installed at ${ndk_dir}"
            exit 1
          fi

          cmake_bin="${sdk_root}/cmake/${project_cmake_version}/bin/cmake"
          if [[ ! -x "${cmake_bin}" ]]; then
            echo "CMake ${project_cmake_version} was not installed at ${cmake_bin}"
            exit 1
          fi

          {
            echo "ANDROID_NDK_HOME=${ndk_dir}"
            echo "ANDROID_NDK_ROOT=${ndk_dir}"
          } >> "${GITHUB_ENV}"

          if [[ -f local.properties ]]; then
            sed '/^ndk\.dir=/d' local.properties > local.properties.ci
            mv local.properties.ci local.properties
          fi
          echo "ndk.dir=${ndk_dir}" >> local.properties

          echo "Selected Android NDK: ${ndk_dir}"
          echo "Selected Android CMake: ${cmake_bin}"

      - name: Configure nested Gradle builds
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.gradle
          cat >> ~/.gradle/init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              if (rootProject.name == 'nmm-protect') {
                  allprojects {
                      tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                          enabled = false
                      }
                  }
              }
          }
          GRADLE

      - name: Use minimal nmmp tool build for Linux CI
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          app_build="app/build.gradle.kts"
          if [[ ! -f "${app_build}" ]]; then
            echo "app build script not found at ${app_build}"
            exit 1
          fi

          if grep -q '"arsc:build",' "${app_build}" && grep -q '^[[:space:]]*"build",' "${app_build}"; then
            perl -0pi -e 's/"arsc:build",\n\s*"build",/"arsc:jar",\n            "jar",/' "${app_build}"
          elif grep -q '"arsc:jar",' "${app_build}" && grep -q '^[[:space:]]*"jar",' "${app_build}"; then
            echo "Minimal nmmp tool build is already configured"
          else
            echo "Unsupported nmmp Gradle task configuration"
            exit 1
          fi

          nmmp_build_block="$(grep -A 4 'nmmpDir.resolve("gradlew")' "${app_build}")"
          if ! grep -q '"arsc:jar",' <<<"${nmmp_build_block}" || ! grep -q '^[[:space:]]*"jar",' <<<"${nmmp_build_block}"; then
            echo "Failed to select the minimal nmmp tool build"
            exit 1
          fi

      - name: Stream nmmp native build output safely
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          native_builder="third_party/nmmp/nmm-protect/apkprotect/src/main/java/com/nmmedit/apkprotect/BuildNativeLib.java"
          nmmp_bridge="third_party/protectPacker/packer/src/main/kotlin/com/apkprotect/packer/dex/NmmpExternalToolBridge.kt"
          if [[ ! -f "${native_builder}" || ! -f "${nmmp_bridge}" ]]; then
            echo "nmmp process sources were not found"
            exit 1
          fi

          if grep -qF '.command(cmds);' "${native_builder}" && grep -qF 'printOutput(process.getErrorStream());' "${native_builder}"; then
            perl -0pi -e 's/\.command\(cmds\);/.command(cmds)\n                .redirectErrorStream(true);/' "${native_builder}"
            sed -i '/printOutput(process.getErrorStream());/d' "${native_builder}"
          elif grep -A 2 -F '.command(cmds)' "${native_builder}" | grep -qF '.redirectErrorStream(true)' \
            && ! grep -qF 'printOutput(process.getErrorStream());' "${native_builder}"; then
            echo "nmmp native builder output streams are already merged"
          else
            echo "Unsupported nmmp native builder process handling"
            exit 1
          fi

          if ! grep -A 2 -F '.command(cmds)' "${native_builder}" | grep -qF '.redirectErrorStream(true)' \
            || grep -qF 'printOutput(process.getErrorStream());' "${native_builder}"; then
            echo "Failed to merge nmmp native builder output streams"
            exit 1
          fi

          if grep -qF 'val output = process.inputStream.bufferedReader().use { it.readText() }' "${nmmp_bridge}"; then
            perl -0pi -e 's/val output = process\.inputStream\.bufferedReader\(\)\.use \{ it\.readText\(\) \}/val output = buildString {\n            process.inputStream.bufferedReader().useLines { lines ->\n                lines.forEach { line ->\n                    println(line)\n                    appendLine(line)\n                }\n            }\n        }/' "${nmmp_bridge}"
          elif grep -qF 'process.inputStream.bufferedReader().useLines { lines ->' "${nmmp_bridge}"; then
            echo "Live nmmp output is already configured"
          else
            echo "Unsupported nmmp bridge output handling"
            exit 1
          fi

          if grep -qF 'use { it.readText() }' "${nmmp_bridge}" \
            || ! grep -qF 'process.inputStream.bufferedReader().useLines { lines ->' "${nmmp_bridge}"; then
            echo "Failed to enable live nmmp output"
            exit 1
          fi

      - name: Expose shell dex2c diagnostics
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          shell_build="third_party/protectPacker/shell/build.gradle.kts"
          if [[ ! -f "${shell_build}" ]]; then
            echo "protectPacker shell build script was not found"
            exit 1
          fi

          if grep -qF 'println(output.trimEnd())' "${shell_build}"; then
            echo "Shell dex2c diagnostics are already exposed"
          elif grep -qF 'error("shell dex2c failed' "${shell_build}"; then
            perl -0pi -e 's/(        val process = processBuilder\.start\(\)\n        val output = process\.inputStream\.bufferedReader\(\)\.readText\(\)\n        val exit = process\.waitFor\(\)\n)(        if \(exit != 0\) \{\n            error\("shell dex2c failed)/$1        if (output.isNotBlank()) {\n            println(output.trimEnd())\n        }\n$2/' "${shell_build}"
          else
            echo "Unsupported shell dex2c process handling"
            exit 1
          fi

          if ! grep -B 4 -F 'error("shell dex2c failed' "${shell_build}" \
            | grep -qF 'println(output.trimEnd())'; then
            echo "Failed to expose shell dex2c diagnostics"
            exit 1
          fi

      - name: Prepare and verify full O-MVLL protection
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          omvll_root="third_party/o-mvll"
          protect_config="app/protect-packer.toml"
          bash "${omvll_root}/setup.sh" "${ANDROID_NDK_HOME}"
          cp "${omvll_root}/deps/LLVM21-NDK29-Linux/omvll-ndk.so" \
            "${omvll_root}/omvll-ndk.so"

          required_paths=(
            "${omvll_root}/omvll-ndk.so"
            "${omvll_root}/deps/LLVM21-NDK29-Linux/lib/libLLVM.so"
            "${omvll_root}/Python-3.10.7/Lib"
            "${omvll_root}/omvll_app_native_config.py"
            "${omvll_root}/omvll_dex2c_config.py"
            "${omvll_root}/omvll_nmmp_config.py"
            "${omvll_root}/omvll_shell_config.py"
          )
          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "${required_path}" ]]; then
              echo "Required O-MVLL component is missing: ${required_path}"
              exit 1
            fi
          done

          if ! grep -q '^omvll_enabled = true$' "${protect_config}"; then
            echo "App dex2c O-MVLL must remain enabled in ${protect_config}"
            exit 1
          fi

          omvll_deps_lib="${omvll_root}/deps/LLVM21-NDK29-Linux/lib"
          ndk_clang="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          if ! ldd_output="$(LD_LIBRARY_PATH="${omvll_deps_lib}" \
            ldd "${omvll_root}/omvll-ndk.so")"; then
            echo "Failed to inspect O-MVLL plugin dependencies"
            exit 1
          fi
          if grep -q 'not found' <<<"${ldd_output}"; then
            echo "O-MVLL plugin has unresolved Linux dependencies"
            exit 1
          fi

          smoke_object="${RUNNER_TEMP}/omvll-smoke.o"
          printf '%s\n' 'int omvll_smoke(int value) { return value + 1; }' | \
            OMVLL_CONFIG="${PWD}/${omvll_root}/omvll_app_native_config.py" \
            OMVLL_PYTHONPATH="${PWD}/${omvll_root}/Python-3.10.7/Lib" \
            LD_LIBRARY_PATH="${omvll_deps_lib}" \
            "${ndk_clang}" \
              --target=aarch64-none-linux-android27 \
              --sysroot="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
              -fpass-plugin="${PWD}/${omvll_root}/omvll-ndk.so" \
              -O2 -x c++ -c - -o "${smoke_object}"
          if [[ ! -s "${smoke_object}" ]]; then
            echo "O-MVLL clang smoke test did not produce an object file"
            exit 1
          fi

      - name: Use short commands for dex2c native link
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          android_mk="third_party/dex2c/project/jni/Android.mk"
          if [[ ! -f "${android_mk}" ]]; then
            echo "dex2c Android.mk not found at ${android_mk}"
            exit 1
          fi

          if ! grep -q '^LOCAL_SHORT_COMMANDS *:=' "${android_mk}"; then
            sed -i '/^LOCAL_MODULE[[:space:]]*:=/a LOCAL_SHORT_COMMANDS := true' "${android_mk}"
          fi

      - name: Configure final protection to reuse the prebuilt shell
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          app_build="app/build.gradle.kts"
          build_version_pattern='return dateFormat.format(Date())'
          if [[ "$(grep -Fxc "    ${build_version_pattern}" "${app_build}")" -ne 1 ]]; then
            echo "Expected one generated build version return in ${app_build}"
            exit 1
          fi
          if [[ "$(grep -c '^[[:space:]]*\":packer:run\",$' "${app_build}")" -ne 1 ]]; then
            echo "Expected one nested :packer:run command in ${app_build}"
            exit 1
          fi

          sed -i \
            's/return dateFormat\.format(Date())/return System.getenv("AAPS_CI_BUILD_VERSION")?.takeIf { it.isNotBlank() } ?: dateFormat.format(Date())/' \
            "${app_build}"
          perl -0pi -e 's/(\n[ \t]*)(":packer:run",)/$1"-x",$1":shell:exportShellDex",$1$2/' "${app_build}"

          ci_build_version="$(date -u +%y%m%d%H%M)"
          echo "AAPS_CI_BUILD_VERSION=${ci_build_version}" >> "${GITHUB_ENV}"

          if ! grep -Fq 'System.getenv("AAPS_CI_BUILD_VERSION")?.takeIf' "${app_build}"; then
            echo "Failed to configure a stable CI build version"
            exit 1
          fi

          packer_command="$(grep -B 3 -A 2 '^[[:space:]]*\":packer:run\",$' "${app_build}")"
          if ! grep -q '^[[:space:]]*"-x",$' <<<"${packer_command}" \
            || ! grep -q '^[[:space:]]*":shell:exportShellDex",$' <<<"${packer_command}"; then
            echo "Failed to configure final protection to reuse the prebuilt shell"
            exit 1
          fi
          echo "Selected stable CI build version: ${ci_build_version}"

      - name: Prebuild release and protected shell in parallel
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          case "${FLAVOR}" in
            full)
              assemble_task=":app:assembleFullRelease"
              protect_task=":app:protectPackerFullRelease"
              verify_task=":app:verifyFullReleaseSettingsBridgeInjection"
              ;;
            mednovo)
              assemble_task=":app:assembleMednovoRelease"
              protect_task=":app:protectPackerMednovoRelease"
              verify_task=":app:verifyMednovoReleaseSettingsBridgeInjection"
              ;;
            *)
              echo "Unsupported flavor: ${FLAVOR}"
              exit 1
              ;;
          esac

          prep_log="${RUNNER_TEMP}/gradle-protection-prep.log"
          app_log="${RUNNER_TEMP}/gradle-app-prebuild.log"
          shell_log="${RUNNER_TEMP}/gradle-shell-prebuild.log"

          cleanup() {
            for pid in "${app_pid:-}" "${shell_pid:-}" "${heartbeat_pid:-}"; do
              if [[ -n "${pid}" ]]; then
                kill "${pid}" >/dev/null 2>&1 || true
                wait "${pid}" >/dev/null 2>&1 || true
              fi
            done
          }

          (
            while true; do
              sleep 60
              echo "Parallel app/shell prebuild is still running..."
            done
          ) &
          heartbeat_pid="$!"
          trap cleanup EXIT
          trap 'echo "Parallel prebuild received SIGTERM."; cleanup; exit 143' TERM INT

          echo "Preparing dex2c/VMP toolchains before parallel work."
          if ! ./gradlew --daemon --console=plain --max-workers=3 \
            :app:syncProtectPackerConfig > "${prep_log}" 2>&1; then
            echo "Protection toolchain preparation failed."
            if [[ "${SHOW_FAILURE_LOG_TAIL}" == "true" ]]; then
              tail -n 500 "${prep_log}"
            fi
            exit 1
          fi

          echo "Building ${assemble_task} and the protected shell concurrently."
          ./gradlew --daemon --console=plain --max-workers=4 \
            "${assemble_task}" "${verify_task}" -x "${protect_task}" > "${app_log}" 2>&1 &
          app_pid="$!"

          (
            cd third_party/protectPacker
            ./gradlew --daemon --console=plain --max-workers=2 \
              -PshellDebugDump=false :shell:exportShellDex
          ) > "${shell_log}" 2>&1 &
          shell_pid="$!"

          set +e
          wait "${app_pid}"
          app_status="$?"
          wait "${shell_pid}"
          shell_status="$?"
          set -e

          if [[ "${app_status}" -ne 0 || "${shell_status}" -ne 0 ]]; then
            echo "Parallel prebuild failed (app=${app_status}, shell=${shell_status})."
            if [[ "${SHOW_FAILURE_LOG_TAIL}" == "true" ]]; then
              echo "App prebuild tail:"
              tail -n 500 "${app_log}"
              echo "Protected shell prebuild tail:"
              tail -n 500 "${shell_log}"
            fi
            exit 1
          fi

          for required_path in \
            app/protect-packer.runtime.toml \
            third_party/nmmp/nmm-protect/build/libs/tools/config.json \
            third_party/protectPacker/shell/build/exported-shell/classes.dex \
            third_party/protectPacker/shell/build/exported-shell/lib/arm64-v8a/libandroidx.graphics.path.so; do
            if [[ ! -s "${required_path}" ]]; then
              echo "Parallel prebuild did not produce ${required_path}"
              exit 1
            fi
          done
          if ! find third_party/nmmp/nmm-protect/build/libs -maxdepth 1 \
            -type f -name 'vm-protect-*.jar' -print -quit | grep -q .; then
            echo "Parallel prebuild did not produce the nmmp vm-protect jar"
            exit 1
          fi
          cleanup
          trap - EXIT TERM INT
          echo "Parallel app/shell prebuild completed."

      - name: Build without publishing public artifacts
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          build_log="${RUNNER_TEMP}/gradle-build.log"

          gradle_task="${GRADLE_TASK_INPUT}"
          if [[ -z "${gradle_task}" ]]; then
            case "${FLAVOR}" in
              full) gradle_task=":app:assembleFullRelease" ;;
              mednovo) gradle_task=":app:assembleMednovoRelease" ;;
              *)
                echo "Unsupported flavor: ${FLAVOR}"
                exit 1
                ;;
            esac
          fi

          echo "Running Gradle task: ${gradle_task}"

          cleanup() {
            if [[ -n "${heartbeat_pid:-}" ]]; then
              kill "${heartbeat_pid}" >/dev/null 2>&1 || true
              wait "${heartbeat_pid}" >/dev/null 2>&1 || true
            fi
          }

          show_build_log_tail() {
            if [[ "${SHOW_FAILURE_LOG_TAIL}" == "true" && -f "${build_log}" ]]; then
              echo "Showing the last 500 lines because show_failure_log_tail=true:"
              tail -n 500 "${build_log}"
            else
              echo "Build log was not printed to avoid exposing private project details."
            fi
          }

          (
            iter=0
            last_line=""
            while true; do
              sleep 30
              iter=$((iter+1))
              now="$(date -u +%H:%M:%S)"
              mem="$(free -m | awk '/Mem:/{print $3"/"$2 "MB"}')"
              swap="$(free -m | awk '/Swap:/{print $3"/"$2 "MB"}')"
              load="$(cut -d' ' -f1 /proc/loadavg)"
              disk="$(df -h "$RUNNER_TEMP" | awk 'NR==2{print $3"/"$2 "("$5")"}')"
              java="$(ps -C java -o %cpu,rss --no-headers 2>/dev/null | awk '{c+=$1;r+=$2} END{if(c>0||r>0){printf "%d%% %.0fMB", c, r/1024}else{print "none"}}')"
              echo "[probe ${iter}] ${now} mem=${mem} swap=${swap} load=${load} disk=${disk} java-cpu/ram=${java}"
              cur="$(tail -n 1 "${build_log}" 2>/dev/null)"
              if [[ -n "${cur}" && "${cur}" != "${last_line}" ]]; then
                echo "  gradle: ${cur}"
                last_line="${cur}"
              fi
            done
          ) &
          heartbeat_pid="$!"

          trap cleanup EXIT
          trap 'cleanup; echo "Build step received SIGTERM at $(date -u +%H:%M:%S)Z."; echo "=== runner diagnostics ==="; free -m; echo "--- cgroup v2 memory.max/current ---"; paste -d" " /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current 2>/dev/null || true; echo "--- memory pressure (PSI) ---"; cat /proc/pressure/memory 2>/dev/null || true; echo "--- top memory processes ---"; ps -eo rss,comm --sort=-rss --no-headers | head -8; echo "--- dmesg tail ---"; (dmesg 2>/dev/null || sudo dmesg 2>/dev/null || echo "(dmesg unavailable)") | tail -40; show_build_log_tail; exit 143' TERM INT

          set +e
          ./gradlew --daemon --console=plain --max-workers=4 \
            "${gradle_task}" \
            -x :app:prepareDex2cToolchain \
            -x :app:prepareNmmpToolchain > "${build_log}" 2>&1
          gradle_status="$?"
          set -e

          cleanup
          trap - EXIT TERM INT

          if [[ "${gradle_status}" -eq 0 ]]; then
            echo "Gradle build completed."
          else
            echo "Gradle build failed."
            show_build_log_tail
            exit 1
          fi

      - name: Verify protected APK output
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          apk_path="app/${FLAVOR}/app-${FLAVOR}-release-protected.apk"
          if [[ ! -s "${apk_path}" ]]; then
            echo "Protected APK not found at ${apk_path}"
            exit 1
          fi
          echo "Verified protected APK: ${apk_path}"

      - name: Upload APK draft to Odoo AAPS update manager
        if: ${{ inputs.upload_to_odoo == 'true' }}
        shell: bash
        working-directory: private-source/${{ inputs.project_dir }}
        env:
          HOST: ${{ secrets.HOST }}
          AAPS_UPDATE_TOKEN: ${{ secrets.AAPS_UPDATE_TOKEN }}
          AAPS_ALLOWED_PHONE_NUMBERS: ${{ secrets.AAPS_ALLOWED_PHONE_NUMBERS }}
        run: |
          set -euo pipefail

          apk_path="app/${FLAVOR}/app-${FLAVOR}-release-protected.apk"

          if [[ ! -f "${apk_path}" ]]; then
            echo "APK not found at: ${apk_path}"
            exit 1
          fi

          allowed_phone_numbers="${AAPS_ALLOWED_PHONE_NUMBERS:-*}"
          force_update_value="0"
          case "${FORCE_UPDATE}" in
            true|1|yes|on) force_update_value="1" ;;
          esac

          response_file="${RUNNER_TEMP}/odoo-upload-response.txt"

          curl --fail --show-error --silent \
            --output "${response_file}" \
            --request POST "${HOST%/}/aaps_update/ci/upload" \
            --header "X-AAPS-Update-Token: ${AAPS_UPDATE_TOKEN}" \
            --form "apk=@${apk_path}" \
            --form "flavor=${FLAVOR}" \
            --form "changelog=${CHANGELOG}" \
            --form "allowed_phone_numbers=${allowed_phone_numbers}" \
            --form "force_update=${force_update_value}"

          echo "APK uploaded to Odoo as a draft AAPS update."
